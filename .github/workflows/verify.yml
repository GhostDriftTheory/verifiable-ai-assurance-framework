name: Assurance and policy verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Test effects, policy differences, and deliberately faulty implementations
        run: python assurance.py test --output "${{ runner.temp }}/haac-v03"
      - name: Recheck execution evidence
        run: python verify.py "${{ runner.temp }}/haac-v03/evidence.json" --sha256-file "${{ runner.temp }}/haac-v03/evidence.sha256" --mutations
      - name: Recheck heterogeneous-policy evidence
        run: python verify.py "${{ runner.temp }}/haac-v03/policy-evidence.json" --sha256-file "${{ runner.temp }}/haac-v03/policy-evidence.sha256" --mutations
  formal:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned Elan and pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          mkdir "$RUNNER_TEMP/elan-install"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-install"
          "$RUNNER_TEMP/elan-install/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Require kernel proofs, concrete correspondence and rejection of false claims
        run: python assurance.py formal
# Formal failure is never skipped or marked successful. Hosted CI has NOT been
# run by preparing this archive. No publish/deploy/write permissions are used.
